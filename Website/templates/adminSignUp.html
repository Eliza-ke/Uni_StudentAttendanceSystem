<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" type="text/css" href="{{ url_for('static', filename='css/index.css') }}">   
</head>
<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>

<body>
  <div class="flex flex-col justify-center items-center bg-slate-50 h-screen">
    <div class="max-w-xl w-full bg-white p-8 rounded-md shadow-lg">

          <div class="p-2 mb-3 flex justify-center">
            <img src="{{ url_for('static', filename='images/welcome_uni.jpg') }}" alt="welcome Image" class="rounded-full h-24 w-24">
          </div>

          <h2 class="text-3xl font-semibold mb-10 text-center">Create Admin Account</h2>
              <form id="signupForm">
                <div class="mb-3">
                  <label for="email" class="text-gray-700 font-medium mb-3">Email</label>
                  <input
                    type="email"
                    class="border border-gray-300 px-3 py-2 rounded w-full focus:outline-none focus:border-blue-800"
                    id="email"
                    name="email"
                    placeholder="email"
                  />
                </div>
  
                  <div class="mb-3">
                    <label for="name" class="text-gray-700 font-medium mb-3">Name</label>
                    <input
                      type="text"
                      class="border border-gray-300 px-3 py-2 rounded w-full focus:outline-none focus:border-blue-800"
                      id="name"
                      name="name"
                      placeholder="name"
                    />
                </div>
                <div class="mb-3">
                    <label for="phone" class="text-gray-700 font-medium mb-3">Phone Number</label>
                    <input
                      type="text"
                      class="border border-gray-300 px-3 py-2 rounded w-full focus:outline-none focus:border-blue-800"
                      id="phone"
                      name="phone"
                      placeholder="phone number"
                    />
                 </div>
                 <div class="mb-3">
                    <p class="block text-gray-700 font-medium mb-4">Role</p>

                    <input type="radio" class="ml-1 mr-2" id="faculty" name="role" value="faculty">
                    <label for="faculty" class="mr-3 my-3">Faculty</label>
            
                    <input type="radio" class="mx-2" id="system_admin" name="role" value="system_admin">
                    <label for="system_admin" class="mr-3 my-3">System Admin</label>
                </div>
                <div class="mb-3">
                    <input type="text" class="border border-gray-300 px-2 py-2 rounded w-full focus:outline-none focus:border-blue-800" placeholder="Enter code" id="rolecode">
                </div>

                  <div class="mb-3">
                    <label for="password1" class="text-gray-700 font-medium mb-2">Password</label>
                    <input
                      type="password"
                      class="border border-gray-300 px-3 py-2 rounded w-full focus:outline-none focus:border-blue-800"
                      id="password1"
                      name="password1"
                      placeholder="password"
                    />
                  </div>
                  <div class="mb-3">
                    <label for="password2" class="text-gray-700 font-medium mb-2">Confirm Password</label>
                    <input
                      type="password"
                      class="border border-gray-300 px-3 py-2 rounded w-full focus:outline-none focus:border-blue-800"
                      id="password2"
                      name="password2"
                      placeholder="please retype your password"
                    />
                  </div>
              <button type="submit" class="bg-purple-500 text-white mt-4 px-4 py-2 rounded-3xl hover:bg-purple-600 focus:outline-none focus:bg-purple-600">Create</button>
              <a href="/adminlogin" class="underline text-sm text-purple-800">Already have an account?</a>
          </form>
      </div>
  </div>
</div>

<script type="text/javascript" src="{{ url_for('static', filename='javascript/signupadmin.js') }}"></script>

</body>
</html>
