<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      rel="stylesheet"
      type="text/css"
      href="{{ url_for('static', filename='css/index.css') }}"
    />
    <title>Profile</title>
  </head>
  <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>

  <body>
    <div class="bg-slate-50 h-screen">
    <div>
      <ul class="bg-violet-50 m-0 list-none overflow-hidden">
        <li class="float-left">
          <a href="/student/profile" class="navi">Your Profile</a>
        </li>
        <li class="float-left">
          <a href="/student/attendance" class="navi">Attendance</a>
        </li>
        <li class="float-right"><a href="/student/logout" class="navi">Logout</a></li>
      </ul>
    </div>
    <div id="toastContainer"></div>
    <div class="flex flex-col justify-center items-center">      
      <div class="mx-auto max-w-3xl mt-20 w-full bg-white p-8 rounded-md shadow-lg">

        <h2 class="text-3xl font-semibold mb-10 text-center">Your Profile</h2>

        <div class="max-w-screen-lg mx-auto mt-10 grid grid-cols-3 gap-4">
          <div>
            <img
              src="{{ url_for('static', filename='images/'+ user.profile) }}"
              alt="Welcome Image"
              class="rounded-full h-40 w-40 object-cover"
            />

            <form id="profileImageForm" enctype="multipart/form-data" method="POST">
                <label for="profileImage" class="underline text-xs ml-9 text-purple-800">
                    Edit Image
                </label>
                <input type="file" onchange="this.form.submit()" name="profileImage" id="profileImage" style="display: none;">
            </form>

          </div>

          <div>
            <p class="pl-5 text-gray-700 font-medium my-6">Name</p>
            <p class="pl-5 text-gray-700 font-medium my-6">Email</p>
            <p class="pl-5 text-gray-700 font-medium my-6">Year</p>
            <p class="pl-5 text-gray-700 font-medium my-6">Batch</p>
            <p class="pl-5 text-gray-700 font-medium my-6">Phone</p>
          </div>

          <div>
            <p class="text-gray-700 font-medium my-6">{{ user.name}}</p>
            <p class="text-gray-700 font-medium my-6">{{ user.email}}</p>
            <p class="text-gray-700 font-medium my-6">{{ student_year }}</p>
            <p class="text-gray-700 font-medium my-6">{{ user.batch}}</p>
            <p class="text-gray-700 font-medium my-6">{{ user.phone}}</p>
          </div>
          <button id="myBtnProfile" class="bg-purple-500 text-white text-sm mt-4 mx-10 px-2 py-2 rounded-3xl hover:bg-purple-600 focus:outline-none focus:bg-purple-600">Edit Profile</button>
        </div>
      </div>

      <div id="myModalProfile" class="modalProfile">
            <div class="mx-auto max-w-lg my-20 w-full bg-white p-8 rounded-md">
              <button class="close3">&times;</button>
              <h2 class="text-xl font-semibold mb-10">Update Profile</h2>
                    <form id="updateProfileForm">
                      <div class="mb-3">
                        <label for="email" class="text-gray-700 font-medium mb-2">Email</label>
                        <input
                          type="text"
                          class="border border-gray-300 px-3 py-2 rounded w-full focus:outline-none focus:border-blue-800"
                          id="email"
                          name="email"
                          value="{{ user.email }}"
                        />
                      </div>
        
                        <div class="mb-3">
                          <label for="name" class="text-gray-700 font-medium mb-2">Name</label>
                          <input
                            type="text"
                            class="border border-gray-300 px-3 py-2 rounded w-full focus:outline-none focus:border-blue-800"
                            id="name"
                            name="name"
                            value="{{ user.name }}"
                          />
                        </div>
                        <div class="mb-3">
                          <label class="pl-5 text-gray-700 font-medium mr-6 mb-2 clear-left">Year</label>
                          <select class="block bg-white w-full border border-gray-300 px-3 py-2 rounded-md shadow-sm focus:outline-none focus:border-purple-500" name="year" id="year">
                            {% for year in years %}
                            <option value="{{ year.id }}" {% if year.year_name == student_year %} selected {% endif %}>{{ year.year_name }}</option>
                            {% endfor %}
                            <option value="BScHons" {% if user.year == 'BScHons' %} selected {% endif %}>BScHons</option>
                        </select>
                        
                        </div>
                        <div class="mb-3">
                          <label for="batch" class="text-gray-700 font-medium mb-2">Batch</label>
                          <input
                            type="text"
                            class="border border-gray-300 px-3 py-2 rounded w-full focus:outline-none focus:border-blue-800"
                            id="batch"
                            name="batch"
                            value="{{ user.batch }}"
                          />
                        </div>
                        <div class="mb-3">
                          <label for="phone" class="text-gray-700 font-medium mb-2">Phone Number</label>
                          <input
                            type="text"
                            class="border border-gray-300 px-3 py-2 rounded w-full focus:outline-none focus:border-blue-800"
                            id="phone"
                            name="phone"
                            value="{{ user.phone }}"
                          />
                        </div>
                    <button type="submit" class="bg-purple-500 text-white mt-4 px-4 py-2 rounded-3xl hover:bg-purple-600 focus:outline-none focus:bg-purple-600">Update</button>
                </form>
            </div>
        </div>
      </div>
        
    <script type="text/javascript" src="{{ url_for('static', filename='javascript/index.js') }}"></script>
    <script type="text/javascript" src="{{ url_for('static', filename='javascript/studentprofile.js') }}"></script>
  </body>
</html>
