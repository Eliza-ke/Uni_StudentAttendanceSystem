{% extends "adminlayout.html" %} {% block title %}Admin Information{% endblock%}
{% block content %}
<div id="toastContainer"></div>
<div class="flex flex-col justify-center items-center bg-white">
  <div class="mx-auto max-w-3xl mt-20 w-full bg-white p-8 rounded-md shadow-lg">
    <h2 class="mt-5 text-3xl font-semibold mb-10 text-center">Your Profile</h2>

    <div class="max-w-screen-lg mx-auto mt-10 grid grid-cols-3 gap-4">
      <div>
        <img
          src="{{ url_for('static', filename='images/'+ user.profile) }}"
          alt="Welcome Image"
          class="rounded-full h-40 w-40 object-cover"
        />

        <form id="profileImageForm" enctype="multipart/form-data" method="POST">
          <label
            for="profileImage"
            class="underline text-xs ml-10 text-purple-800"
          >
            Edit Image
          </label>
          <input
            type="file"
            onchange="this.form.submit()"
            name="profileImage"
            id="profileImage"
            style="display: none"
          />
        </form>
      </div>

      <div>
        <p class="pl-5 text-gray-700 font-medium my-6">Name</p>
        <p class="pl-5 text-gray-700 font-medium my-6">Email</p>
        <p class="pl-5 text-gray-700 font-medium my-6">Phone</p>
        <p class="pl-5 text-gray-700 font-medium my-6">Role</p>
      </div>

      <div>
        <p class="text-gray-700 font-medium my-6">{{ user.name}}</p>
        <p class="text-gray-700 font-medium my-6">{{ user.email}}</p>
        <p class="text-gray-700 font-medium my-6">{{ user.phone}}</p>
        <p class="text-gray-700 font-medium my-6">
          {% if user.roleCode == 'S1001' %} System Admin {% else %} Faculty {%
          endif %}
        </p>
      </div>
      <button
        id="myBtnAdminProfile"
        class="bg-purple-500 text-white text-sm mt-4 mx-10 px-2 py-2 rounded-3xl hover:bg-purple-600 focus:outline-none focus:bg-purple-600"
      >
        Edit Profile
      </button>
    </div>
  </div>

  <div id="myModalAdminProfile" class="modalAdminProfile">
    <div class="mx-auto max-w-lg my-20 w-full bg-white p-8 rounded-md">
      <button class="close6">&times;</button>
      <form id="updateAdminProfileForm">
        <div class="mb-3">
          <label for="email" class="text-gray-700 font-medium mb-2"
            >Email</label
          >
          <input
            type="text"
            class="border border-gray-300 px-3 py-2 rounded w-full focus:outline-none focus:border-blue-800"
            id="email"
            name="email"
            value="{{ user.email }}"
          />
        </div>

        <div class="mb-3">
          <label for="name" class="text-gray-700 font-medium mb-2">Name</label>
          <input
            type="text"
            class="border border-gray-300 px-3 py-2 rounded w-full focus:outline-none focus:border-blue-800"
            id="name"
            name="name"
            value="{{ user.name }}"
          />
        </div>

        <div class="mb-3">
          <label for="phone" class="text-gray-700 font-medium mb-2"
            >Phone Number</label
          >
          <input
            type="text"
            class="border border-gray-300 px-3 py-2 rounded w-full focus:outline-none focus:border-blue-800"
            id="phone"
            name="phone"
            value="{{ user.phone }}"
          />
        </div>

        <button
          type="submit"
          class="bg-purple-500 text-white mt-4 px-4 py-2 rounded-3xl hover:bg-purple-600 focus:outline-none focus:bg-purple-600"
        >
          Update
        </button>
      </form>
    </div>
  </div>

  {% endblock %}
</div>
