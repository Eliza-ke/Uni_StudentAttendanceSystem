{% extends "adminlayout.html" %} {% block title %} Year {% endblock%} 
{% block content %}

<div id="toastContainer"></div>
<div class="m-10 flex flex-col justify-center items-center bg-white">
<h3 class="mt-5 text-2xl font-semibold text-center">Class Information</h3>
  <div>
    <table class="text-center mx-16 my-10 shadow-md">
    <thead class="bg-violet-50 text-lg font-semibold">
        <tr>
            <th class="py-3 px-5">Class Name</th>
            <th class="py-3 px-5" colspan="2">Action</th>
        </tr>
    </thead>
    <tbody>
        {% for year in years %}
        <tr>
            <td class="p-3">{{ year.year_name }}</td>
            <td class="p-3"> 
                <a id="updateYearBtn" class="mx-2 text-green-600 hover:scale-110 hover:text-green-500" onclick="updateData(this)" data-id-value="{{ year.id }}">
                    <i class="fas fa-wrench"></i>
                </a>
            </td>
            <td class="p-3">
                <button onclick=deleteAlert({{year.id}}) class="mx-2 text-red-600 hover:scale-110 hover:text-red-500" data-item-id="2">
                    <i class="fas fa-trash-alt"></i>
            </button>
            </td>  
        </tr>
        {% endfor %}
    </tbody>
</table>
</div>

<div class="mt-20">
  <h2 class="text-xl mb-5 text-center">Add Class</h2>
  <form id="yearForm">
      <div class="mb-3">
          <label for="newYear" class="text-gray-700 font-medium mb-3">Class</label>
          <input
              type="text"
              class="border border-gray-300 px-3 py-2 rounded w-lg focus:outline-none focus:border-blue-800"
              id="newYear"
              name="newYear"
              placeholder="Year"
          />
          <button type="submit" class="mr-0 m-3 rounded-lg bg-purple-500 text-white px-4 py-2 rounded-3xl hover:bg-purple-600 focus:outline-none focus:bg-purple-600">New <i class="fas fa-plus"></i></button>
      </div>
  </form>
</div>

<div id="myModalYear" class="modalYear">
    <div class="mx-auto max-w-lg my-20 w-full bg-white p-8 rounded-md">
        <button class="close4">&times;</button>
        <form id="updateYearForm">
            <div class="mb-3">
                <label for="updateYear" class="text-gray-700 font-medium mb-2">Year</label>
                <input
                    type="text"
                    class="border border-gray-300 px-3 py-2 rounded w-full focus:outline-none focus:border-blue-800"
                    id="updateYear"
                    name="updateYear"
                />
            </div>
            <button type="submit" class="bg-purple-500 text-white mt-4 px-4 py-2 rounded-3xl hover:bg-purple-600 focus:outline-none focus:bg-purple-600">Update</button>
        </form>
    </div>
</div>

    
</div>
{% endblock %}
