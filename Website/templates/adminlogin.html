<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" type="text/css" href="{{ url_for('static', filename='css/index.css') }}">   
</head>
<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>

<body>

    <div class="flex flex-col justify-center items-center bg-slate-50 h-screen">
        <div class="max-w-xl w-full bg-white p-8 rounded-md shadow-lg">
            <div class="p-2 mb-3 flex justify-center">
                <img src="{{ url_for('static', filename='images/welcome_uni.jpg') }}" alt="welcome Image" class="rounded-full h-24 w-24">
            </div>
            <h2 class="text-3xl font-semibold mb-5 text-center">Admin Login</h2>
              <form id="loginForm">
                <div class="mb-3">
                  <label for="email" class="text-gray-700 font-medium mb-3">Email</label>
                  <input
                    type="email"
                    class="border border-gray-300 px-3 py-2 rounded w-full focus:outline-none focus:border-blue-800"
                    id="email"
                    name="email"
                    placeholder="email"
                  />
                </div>
  
                  <div class="mb-3">
                    <label for="password" class="text-gray-700 font-medium mb-2">Password</label>
                    <input
                      type="password"
                      class="border border-gray-300 px-3 py-2 rounded w-full focus:outline-none focus:border-blue-800"
                      id="password"
                      name="password"
                      placeholder="password"
                    />
                  </div>
              <button type="submit" class="bg-purple-500 text-white mt-4 px-4 py-2 rounded-3xl hover:bg-purple-600 focus:outline-none focus:bg-purple-600">Login</button>
              <a href="/adminSignUp" class="underline text-sm text-purple-800">Don't have an account?</a>
          </form>
      </div>
  </div>
  <script type="text/javascript" src="{{ url_for('static', filename='javascript/loginadmin.js') }}"></script>

</body>
</html>
